<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tablet Display setup</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #14161b;
    --card: #1d2028;
    --text: #eef0f4;
    --muted: #9aa1af;
    --accent: #5b8cff;
    --accent-text: #0b0e14;
    --border: #2a2e38;
    --mono-bg: #0f1116;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    padding: 32px 16px 64px;
  }
  main { width: 100%; max-width: 420px; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  p.lead { color: var(--muted); margin-top: 0; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    margin-top: 18px;
  }
  .status-line { font-size: 0.92rem; color: var(--muted); margin: 0 0 14px; }
  .status-line.ok { color: #7fd88f; }
  .status-line.fail { color: #e88a8a; }
  .step { margin-top: 18px; }
  .step:first-of-type { margin-top: 0; }
  .step-label {
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    font-weight: 600;
    margin: 0 0 8px;
  }
  a.button, button.primary {
    display: block;
    width: 100%;
    box-sizing: border-box;
    padding: 14px 16px;
    font-size: 1.05rem;
    font-weight: 600;
    border-radius: 10px;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
  }
  button.primary {
    border: none;
    background: var(--accent);
    color: var(--accent-text);
  }
  button.primary:active { opacity: 0.85; }
  a.button {
    border: 1px solid var(--accent);
    background: transparent;
    color: var(--accent);
  }
  a.button:active { opacity: 0.7; }
  #storeLinks a.button + a.button { margin-top: 8px; }
  .manual {
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .manual h2 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--muted); margin: 0 0 8px; font-weight: 600; }
  code.address {
    display: block;
    background: var(--mono-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 1rem;
    word-break: break-all;
  }
  .hint { color: var(--muted); font-size: 0.85rem; margin-top: 10px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Tablet Display</h1>
  <p class="lead">Connect this device as a wireless second monitor.</p>

  <div class="card">
    <p class="status-line" id="reportStatus">Reading your screen&hellip;</p>

    <div class="step" id="storeStep" hidden>
      <p class="step-label" id="storeStepLabel">1. Get the app (skip if already installed)</p>
      <div id="storeLinks"></div>
    </div>

    <div class="step">
      <p class="step-label" id="connectLabel">Connect</p>
      <button class="primary" id="connectButton" hidden>Open in VNC Viewer</button>
    </div>

    <div class="manual">
      <h2>Manual entry</h2>
      <code class="address" id="manualAddress">detecting&hellip;</code>
      <p class="hint">Open your VNC app and connect to this address if the button above
        doesn't work.</p>
    </div>
  </div>
</main>

<script>
(function () {
  "use strict";

  var REALVNC_ANDROID = "https://play.google.com/store/apps/details?id=com.realvnc.viewer.android";
  var REALVNC_IOS = "https://apps.apple.com/app/id352019548";
  var REALVNC_WINDOWS = "https://www.realvnc.com/en/connect/download/viewer/windows/";

  var statusEl = document.getElementById("reportStatus");
  var connectButton = document.getElementById("connectButton");
  var connectLabel = document.getElementById("connectLabel");
  var storeStep = document.getElementById("storeStep");
  var storeStepLabel = document.getElementById("storeStepLabel");
  var storeLinks = document.getElementById("storeLinks");
  var manualAddress = document.getElementById("manualAddress");

  // The server that served this page is the only address a same-origin
  // fetch can reach -- also the address the VNC session listens on.
  var host = location.hostname;

  function detectPlatform() {
    // Checked first and confirmed necessary live: on a real Galaxy Tab S10
    // FE, Chrome's legacy navigator.userAgent read as a full desktop Linux
    // string ("X11; Linux x86_64" ... no "Android" anywhere) -- large-screen
    // Android tablets can get Chrome's desktop-site UA by default. The
    // User-Agent Client Hints API reports the true platform separately from
    // that legacy string and is not affected by the same desktop-site
    // substitution, so it is checked first wherever the browser supports it.
    if (navigator.userAgentData && navigator.userAgentData.platform) {
      var chPlatform = navigator.userAgentData.platform;
      if (/Android/i.test(chPlatform)) return "android";
      if (/iOS/i.test(chPlatform)) return "ios";
      if (/Windows/i.test(chPlatform)) return "windows";
    }

    var ua = navigator.userAgent || "";
    var isIPadOS13Plus = navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1;
    if (/Android/i.test(ua)) return "android";
    if (/iPhone|iPad|iPod/i.test(ua) || isIPadOS13Plus) return "ios";
    if (/Windows/i.test(ua)) return "windows";
    return "other";
  }

  var ALL_STORES = [
    { url: REALVNC_ANDROID, label: "Get RealVNC Viewer on Google Play" },
    { url: REALVNC_IOS, label: "Get RealVNC Viewer on the App Store" },
    { url: REALVNC_WINDOWS, label: "Download RealVNC Viewer for Windows" }
  ];

  function storeInfoFor(platform) {
    switch (platform) {
      case "android": return [ALL_STORES[0]];
      case "ios": return [ALL_STORES[1]];
      case "windows": return [ALL_STORES[2]];
      // Detection is a best-effort signal, not a hard dependency (Chrome's
      // desktop-site UA on tablets defeats it outright -- confirmed live).
      // Showing every option rather than hiding this step keeps the feature
      // working even when detection is wrong, at the cost of one extra tap.
      default: return ALL_STORES;
    }
  }

  function reportDisplay() {
    var payload = {
      width: window.screen.width,
      height: window.screen.height,
      dpr: window.devicePixelRatio || 1
    };
    return fetch("/setup/report", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    }).then(function (res) {
      if (!res.ok) throw new Error("server rejected the report");
      return payload;
    });
  }

  // The daemon substitutes the real port into this constant when it serves
  // the page (wayvnc's listening port is only known once the session has
  // started, and this file has no template engine of its own).
  var VNC_PORT = "__VNC_PORT__";

  function vncAddress() {
    return host + ":" + VNC_PORT;
  }

  var platform = detectPlatform();
  var address = vncAddress();
  manualAddress.textContent = address;

  // Whether tapping "Open in VNC Viewer" actually launched an app cannot be
  // detected reliably: on Android, navigating to an unregistered vnc://
  // link can pop the OS "complete action using" chooser, which toggles page
  // visibility the same way a real app switch would even if the user then
  // cancels it with nothing installed. A timeout-based fallback keyed off
  // that signal was tried first and confirmed to silently do nothing in
  // exactly that case. So the store link is not a fallback at all here --
  // it is always shown as its own equally-weighted first step, independent
  // of whatever the vnc:// attempt does.
  var stores = storeInfoFor(platform);
  stores.forEach(function (store) {
    var link = document.createElement("a");
    link.className = "button";
    link.href = store.url;
    link.target = "_blank";
    link.rel = "noopener";
    link.textContent = store.label;
    storeLinks.appendChild(link);
  });
  if (stores.length > 1) {
    storeStepLabel.textContent = "1. Get the app (not sure which? pick the one matching this device)";
  }
  storeStep.hidden = false;
  connectLabel.textContent = "2. Connect";

  connectButton.hidden = false;
  connectButton.addEventListener("click", function () {
    window.location.href = "vnc://" + address;
  });

  reportDisplay().then(function (payload) {
    statusEl.textContent = "Screen detected: " + payload.width + "×" + payload.height +
      " @" + payload.dpr + "x — the display is being resized now.";
    statusEl.className = "status-line ok";
  }).catch(function () {
    statusEl.textContent = "Could not report your screen size automatically. " +
      "The display will stay at its default resolution; connect manually below.";
    statusEl.className = "status-line fail";
  });
})();
</script>
</body>
</html>
